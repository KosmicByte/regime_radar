[project]
name = "regime-radar"
version = "0.1.0"
description = "Explainable market-regime detection via Koopman/DMD, EDMD, and HMM ensembles."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Aditya" }]
keywords = ["quant", "regime-detection", "koopman", "dmd", "edmd", "hmm", "markets"]

dependencies = [
    "numpy>=1.26",
    "scipy>=1.12",
    "pandas>=2.2",
    "polars>=1.0",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "typer>=0.12",
    "rich>=13.7",
    "matplotlib>=3.9",
    "plotly>=5.22",
    "scikit-learn>=1.5",
    "hmmlearn>=0.3.2",
    "yfinance>=0.2.40",
    "python-dateutil>=2.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-cov>=5.0",
    "ruff>=0.5",
    "mypy>=1.10",
    "ipykernel>=6.29",
]

[project.scripts]
regime = "regime_radar.__main__:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/regime_radar"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM", "RUF"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src/regime_radar/core", "src/regime_radar/models.py", "src/regime_radar/eval/metrics.py"]

[[tool.mypy.overrides]]
module = ["hmmlearn.*", "yfinance.*", "scipy.*", "matplotlib.*", "plotly.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
    "slow: marks tests as slow (~1-2 min runtime); the synthetic benchmark suite",
]
